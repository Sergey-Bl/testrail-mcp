[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testrail-mcp-server"
version = "0.3.2"
description = "MCP server for TestRail — CRUD plus AI test-case generation from text, Jira tickets, and Confluence pages"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sergey Blotskiy" }
]
keywords = ["mcp", "testrail", "qa", "test-cases", "jira", "confluence", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Sergey-Bl/testrail-mcp"
Repository = "https://github.com/Sergey-Bl/testrail-mcp"
Issues = "https://github.com/Sergey-Bl/testrail-mcp/issues"

[project.scripts]
testrail-mcp-server = "testrail_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testrail_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
