# Smithery config — https://smithery.ai/docs/build/project-config/smithery-yaml
runtime: "container"

build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."

startCommand:
  type: "http"

  # Smithery renders this as a form in their UI. Users fill in their own
  # TestRail / Jira / Confluence / Anthropic credentials per-session.
  configSchema:
    type: "object"
    required:
      - "testrailBaseUrl"
      - "testrailUser"
      - "testrailApiKey"
      - "anthropicApiKey"
    properties:
      testrailBaseUrl:
        type: "string"
        title: "TestRail Base URL"
        description: "Your TestRail instance URL, e.g. https://your-org.testrail.io"
      testrailUser:
        type: "string"
        title: "TestRail User Email"
      testrailApiKey:
        type: "string"
        title: "TestRail API Key"
        description: "Create one under TestRail → My Settings → API Keys"
        format: "password"
      testrailProjectId:
        type: "integer"
        title: "Default Project ID"
        description: "Optional. Used by tools that don't take an explicit project_id."
        default: 0
      testrailSuiteId:
        type: "integer"
        title: "Default Suite ID"
        description: "Optional. Used by tools that don't take an explicit suite_id."
        default: 0
      anthropicApiKey:
        type: "string"
        title: "Anthropic API Key"
        description: "Required for AI test-case generation tools."
        format: "password"
      caseGenModel:
        type: "string"
        title: "Generation Model"
        description: "Claude model used for case generation."
        default: "claude-haiku-4-5-20251001"
      jiraBaseUrl:
        type: "string"
        title: "Jira Base URL"
        description: "Optional. Only needed for generate_cases_from_jira."
      jiraUser:
        type: "string"
        title: "Jira User Email"
      jiraApiToken:
        type: "string"
        title: "Jira API Token"
        format: "password"
      confluenceBaseUrl:
        type: "string"
        title: "Confluence Base URL"
        description: "Optional. Only needed for generate_cases_from_confluence."
      confluenceEmail:
        type: "string"
        title: "Confluence Email"
      confluenceApiToken:
        type: "string"
        title: "Confluence API Token"
        format: "password"

  # Maps the Smithery config UI values to env vars the container reads.
  commandFunction: |
    (config) => ({
      command: "testrail-mcp-server",
      args: [],
      env: {
        MCP_TRANSPORT: "http",
        PORT: "8080",
        HOST: "0.0.0.0",
        TESTRAIL_BASE_URL: config.testrailBaseUrl,
        TESTRAIL_USER: config.testrailUser,
        TESTRAIL_API_KEY: config.testrailApiKey,
        TESTRAIL_PROJECT_ID: String(config.testrailProjectId || 0),
        TESTRAIL_SUITE_ID: String(config.testrailSuiteId || 0),
        ANTHROPIC_API_KEY: config.anthropicApiKey,
        CASE_GEN_MODEL: config.caseGenModel || "claude-haiku-4-5-20251001",
        JIRA_BASE_URL: config.jiraBaseUrl || "",
        JIRA_USER: config.jiraUser || "",
        JIRA_API_TOKEN: config.jiraApiToken || "",
        CONFLUENCE_BASE_URL: config.confluenceBaseUrl || "",
        CONFLUENCE_EMAIL: config.confluenceEmail || "",
        CONFLUENCE_API_TOKEN: config.confluenceApiToken || ""
      }
    })
